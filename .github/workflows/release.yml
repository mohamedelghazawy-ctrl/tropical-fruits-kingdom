name: Release AAB
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
        with: { packages: "" }
      - name: Install SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;36.0.0" "platforms;android-36.1"; sdkmanager "platforms;android-37.0" || sdkmanager "platforms;android-37"
      - name: Create debug keystore
        run: keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.3.1" }
      - name: Build signed AAB + release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle :app:bundleRelease :app:assembleRelease --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v4
        with: { name: tropical-kingdom-release-aab, path: app/build/outputs/bundle/release/*.aab }
      - name: Upload release APK (for testing on phone)
        if: success()
        uses: actions/upload-artifact@v4
        with: { name: tropical-kingdom-release-apk, path: app/build/outputs/apk/release/*.apk }
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: release-build-log, path: build.log }
