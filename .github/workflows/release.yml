name: Release AAB
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
        with: { packages: "" }
      - name: Install SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;36.0.0" "platforms;android-36.1"; sdkmanager "platforms;android-37.0" || sdkmanager "platforms;android-37"
      - name: Create debug keystore
        run: keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Create temporary signing key (the real signing is done on your phone)
        run: keytool -genkeypair -keystore "$RUNNER_TEMP/temp.jks" -storepass temp12345 -alias upload -keypass temp12345 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Temp,O=Temp,C=US"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.3.1" }
      - name: Build signed AAB + release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/temp.jks
          STORE_PASSWORD: temp12345
          KEY_PASSWORD: temp12345
          KEY_ALIAS: upload
        run: gradle :app:bundleRelease :app:assembleRelease --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v4
        with: { name: tropical-kingdom-release-aab-unsigned, path: app/build/outputs/bundle/release/*.aab }
      - name: Upload R8 mapping (deobfuscation file for Play Console)
        if: success()
        uses: actions/upload-artifact@v4
        with: { name: r8-mapping, path: app/build/outputs/mapping/release/mapping.txt }
      - name: Upload release APK (for testing on phone)
        if: success()
        uses: actions/upload-artifact@v4
        with: { name: tropical-kingdom-release-apk-tempsigned, path: app/build/outputs/apk/release/*.apk }
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: release-build-log, path: build.log }
